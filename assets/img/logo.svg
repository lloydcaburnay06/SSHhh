  <!-- App Icon Tile -->
  <rect x="16" y="16" width="128" height="128" rx="30" fill="url(#tileBg)" stroke="#1e293b" stroke-width="3"/>
  <path d="M40 60L62 80L40 100" stroke="url(#chevGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="61" y="96" width="22" height="7" rx="3" fill="#10b981"/>
  <path d="M72 80 H83 L88 71 L93 90 L99 61 L105 99 L111 69 L116 88 L121 75 L125 80 H134"
