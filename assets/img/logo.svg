  <!-- Tagline -->
  <text x="170" y="119" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Deployments so quiet, you can hear a server drop.</text>
