<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" width="700" height="160" fill="none">
  <defs>
    <linearGradient id="tileBg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="chevGrad" x1="36" y1="58" x2="64" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="waveMark" x1="70" y1="80" x2="132" y2="80" gradientUnits="userSpaceOnUse">
