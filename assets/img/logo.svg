      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="hushGrad" x1="275" y1="40" x2="395" y2="105" gradientUnits="userSpaceOnUse">
