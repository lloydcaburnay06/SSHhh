  <!-- Attenuating "SSHhh" whisper waveform fading into silence -->
  <path d="M214 256 H252 C258 256 261 232 266 232 C272 232 276 286 282 286 C289 286 293 196 300 196 C307 196 312 316 319 316 C326 316 331 218 338 218 C344 218 349 282 355 282 C361 282 365 242 371 242 C376 242 379 256 386 256 H426"
